name: Release

# Trigger on any tag push matching v* (e.g. v2.0.0, v1.0.1)
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Package and Release
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repo at the tagged commit
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Extract the version number from the tag (e.g. v2.0.0 -> 2.0.0)
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # 3. Build the zip
      #    The repo root IS the GameJolt plugin folder, so we zip everything
      #    into a folder called GameJolt/ so users can drop it straight into
      #    their project's Plugins/ directory.
      - name: Package plugin zip
        run: |
          mkdir -p staging/GameJolt
          # Copy everything except the .git folder and the staging dir itself
          rsync -av \
            --exclude='.git' \
            --exclude='staging' \
            --exclude='.github' \
            ./ staging/GameJolt/
          cd staging
          zip -r "../GameJolt-v${{ steps.version.outputs.VERSION }}.zip" GameJolt/
          cd ..

      # 4. Create a GitHub Release and upload the zip as an asset.
      #    The release will be created as a draft so you can review it,
      #    add release notes from the CHANGELOG, then publish manually.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "GameJolt Plugin v${{ steps.version.outputs.VERSION }}"
          draft: true
          generate_release_notes: false
          body: |
            ## GameJolt Plugin for Unreal Engine v${{ steps.version.outputs.VERSION }}

            ### Installation
            1. Download `GameJolt-v${{ steps.version.outputs.VERSION }}.zip` below.
            2. Extract the `GameJolt` folder into your project's `Plugins/` directory.
            3. Right-click your `.uproject` and select **"Generate Visual Studio project files"**.
            4. Open your project and build when prompted.

            ### Compatibility
            Tested with Unreal Engine 4.27 – 5.7 (source plugin, built locally by the user).

            ### Changelog
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full details.
          files: |
            GameJolt-v${{ steps.version.outputs.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}